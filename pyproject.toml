[project]
name = "property-arrears-dashboard"
version = "0.1.0"
description = "Merge a rent roll, accounting export and CRM export into one occupancy and arrears dashboard."
requires-python = ">=3.10"

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
